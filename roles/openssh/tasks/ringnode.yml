- name: "Install ringnode sshd_config"
  template:
    src=sshd_config.ringnode
    dest=/etc/ssh/sshd_config
    owner=root
    group=root
    mode=0644
  notify: restart openssh

- name: "Install ringnode ssh_config"
  template:
    src=ssh_config.ringnode
    dest=/etc/ssh/ssh_config
    owner=root
    group=root
    mode=0644

