<VirtualHost *:80>
ServerName portal.ring.nlnog.net
Redirect permanent / https://portal.ring.nlnog.net/
</VirtualHost>

<VirtualHost *:443>
ServerAdmin ring-admins@nlnog.net
ServerName portal.ring.nlnog.net

DocumentRoot /var/www/portal.ring.nlnog.net
<Directory /var/www/portal.ring.nlnog.net>
    Order deny,allow
    Allow from all
</Directory>

WSGIDaemonProcess ring_portal \
	user=www-data group=www-data \
	python-home=/var/www/portal.ring.nlnog.net/venv \
	python-path=/var/www/portal.ring.nlnog.net

WSGIProcessGroup ring_portal
WSGIApplicationGroup %{GLOBAL}
WSGIScriptAlias / /var/www/portal.ring.nlnog.net/ringweb/wsgi.py \
	process-group=ring_portal application-group=%{GLOBAL}

ErrorLog ${APACHE_LOG_DIR}/portal.ring.nlnog.net-error.log

# Possible values include: debug, info, notice, warn, error, crit,
# alert, emerg.
LogLevel warn

CustomLog ${APACHE_LOG_DIR}/portal.ring.nlnog.net-access.log combined

SSLEngine On
SSLCACertificateFile /var/lib/ssl/portal.ring.nlnog.net/fullchain.pem

SSLCertificateFile /var/lib/ssl/portal.ring.nlnog.net/cert.pem
SSLCertificateKeyFile /var/lib/ssl/portal.ring.nlnog.net/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateChainFile /var/lib/ssl/portal.ring.nlnog.net/chain.pem

</VirtualHost>
